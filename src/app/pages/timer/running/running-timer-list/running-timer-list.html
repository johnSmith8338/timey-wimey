@for (timer of store.timers(); track timer.id) {
    <app-running-timer-card [timer]="timer" (remove)="remove($event)" [class.scale]="store.timers().length>1" />
}
@if (store.finished(); as timer) {
    <app-timer-finished-dialog
        [timer]="timer"
        (repeat)="repeat(timer)"
        (stop)="stop(timer)" />
}
