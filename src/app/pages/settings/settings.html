<h3>notifications</h3>
<app-set-notifications />

<h3>theme</h3>
<app-set-theme />

<h3>wake lock</h3>
<app-set-wakelock />

<h3>alarm sorting</h3>
<app-set-alarm-sort />

<h3>Auto stop after</h3>
<app-set-alarm-duration />

<h3>clear history</h3>
<app-set-history-remove />

<h3>backup</h3>
<button (click)="exportBackup()">export json</button>
<input #file hidden type="file" accept=".json" (change)="importBackup($event)">
<button (click)="file.click()">import json</button>

<h3>reset app</h3>
<app-set-app-reset />

<h3>update</h3>
<app-set-update-check />

<h3>install app</h3>
<app-set-app-install-prompt />
