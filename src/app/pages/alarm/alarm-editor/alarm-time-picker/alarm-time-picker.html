<app-picker-mode-selector />

@switch (pickerMode()) {
    @case ('dial') {
        <app-alarm-face 
            [engine]="timeEngine()"
            [timeFormat]="timeFormat()"
            (dialStep)="dialChanged($event)"
            (meridiemToggle)="toggleMeridiem()" />
    }
    @case ('inputs') {
        <app-alarm-inputs 
            [engine]="timeEngine()"
            [timeFormat]="timeFormat()"
         />
    }
    @case ('wheel') {
        <app-alarm-wheel-picker 
            [engine]="timeEngine()"
            [timeFormat]="timeFormat()"
         />
    }
}
