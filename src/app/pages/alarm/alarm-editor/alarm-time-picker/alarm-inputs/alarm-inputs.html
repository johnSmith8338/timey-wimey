<div class="inputs">
    <input type="number"
        min="0"
        max="23"
        [value]="engine().hour()"
        (input)="updateHour($event)" />
    :
    <input type="number"
        min="0"
        max="59"
        [value]="engine().minute()"
        (input)="updateMinute($event)" />
</div>
