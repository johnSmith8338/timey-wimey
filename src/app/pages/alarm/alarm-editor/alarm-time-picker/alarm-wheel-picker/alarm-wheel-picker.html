<div class="wheels">
    <app-alarm-hour-picker
        mode="wheel"
        [engine]="engine()"
        [timeFormat]="timeFormat()"
    />
    <app-wheel-picker name="minute"
        [items]="minuteItems"
        [value]="engine().minute()"
        (valueChange)="engine().updateMinute($event)" />
</div>
