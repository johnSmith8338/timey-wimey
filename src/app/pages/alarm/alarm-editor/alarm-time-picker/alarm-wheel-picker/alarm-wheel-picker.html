<div class="wheels">
    <app-wheel-picker name="hour"
        [items]="hourItems"
        [value]="engine().hour()"
        (valueChange)="engine().updateHour($event)" />
    <app-wheel-picker name="minute"
        [items]="minuteItems"
        [value]="engine().minute()"
        (valueChange)="engine().updateMinute($event)" />
</div>
