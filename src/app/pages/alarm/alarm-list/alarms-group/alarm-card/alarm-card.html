<div class="alarm-card">
    <div class="drag-handle" cdkDragHandle [class.disabled]="dragDisabled()">☰</div>
    <div>
        <h4>{{alarm().title}}</h4>
        <strong>
            {{alarmFormat.formatTime(alarm().hour,alarm().minute)}}
        </strong>
    </div>
    <div>
        <button (click)="facade.toggleAlarm(alarm())">{{alarm().enabled ? 'ON' : 'OFF'}}</button>
        <button (click)="facade.editAlarm(alarm())">edit</button>
        <button (click)="facade.duplicateAlarm(alarm())">duplicate</button>
        <button (click)="facade.requestDeleteAlarm(alarm())">delete</button>
    </div>
</div>
