<app-alarm-next-card />

<app-alarm-search />

<app-alarm-list />

<app-alarm-history />

@if (facade.editorOpened()) {
    <app-alarm-editor />
}

@if (ringing.ringing()) {
    <app-alarm-ringing-dialog />
}

@if (facade.deletingAlarm(); as alarm) {
    <app-confirm-dialog
        title="delete alarm?"
        [message]="`delete alarm '${alarm.title}'?`"
        (confirm)="facade.confirmDeleteAlarm()"
        (cancel)="facade.cancelDeleteAlarm()" />
}

@if (facade.deletingGroup(); as group) {
    <app-confirm-dialog
        title="delete group?"
        [message]="`delete group '${group.title}'?`"
        (confirm)="facade.confirmDeleteGroup()"
        (cancel)="facade.cancelDeleteGroup()" />
}

@if (facade.notificationPrompt()) {
    <app-confirm-dialog
        title="enable notifications?"
        message="allow notifications to receive alarm alerts."
        (confirm)="facade.confirmNotificationPrompt()"
        (cancel)="facade.cancelNotificationPrompt()" />
}
