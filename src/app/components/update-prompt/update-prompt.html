@if (updateSvc.updateAvailable()) {
    @if (!updateSvc.updating()) {
        <div class="update-prompt">
            <p>new version is available</p>
            @if (updateSvc.currentVersion()&&updateSvc.latestVersion()) {
                <p>{{updateSvc.currentVersion()}} → {{updateSvc.latestVersion()}}</p>
            }
            <div class="actions">
                <button type="button" (click)="updateSvc.update()">update</button>
                <button type="button" (click)="updateSvc.postpone()">later</button>
            </div>
        </div>
    }@else {
        <div class="update-overlay">
            <div class="update-dialog">
                <div class="spinner"></div>
                <h3>updating...</h3>
                <div class="progress">
                    <div class="progress-bar"></div>
                </div>
                <small>please don't close the application</small>
            </div>
        </div>
    }
}
