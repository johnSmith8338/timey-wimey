<button class="sheet-header" (click)="toggle()" [attr.aria-expanded]="opened()">
    <!-- <span>{{title()}}</span> -->
    @if (selectedItem(); as item) {
        <strong>{{item.title}}</strong>
    }
    <span>{{opened() ? '▲' : '▼'}}</span>
</button>
@if (opened()) {
    <div class="items">
        @for (item of items(); track item.id) {
            <button class="item" (click)="select(item)">
                <span class="text">
                    <strong>{{item.title}}</strong>
                    @if (item.subtitle) {
                        <small>{{item.subtitle}}</small>
                    }
                </span>
                @if (item.id===selected()) {
                    <span>✓</span>
                }
            </button>
        }
    </div>
}
