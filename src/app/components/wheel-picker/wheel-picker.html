<div class="wheel" #wheel (scroll)="onScroll()" [class.disabled]="disabled()">
    @for (item of displayItems(); track $index) {
        <button class="item"
            [class.scrolling]="scrolling()"
            [class]="scrolling() ? '' : getItemClass($index)"
            [class.selected]="item===value()"
            (click)="valueChange.emit(item)"
            [disabled]="disabled()">
            {{formatItem()(item)}}
        </button>
    }
</div>
<div class="selection-window"></div>
