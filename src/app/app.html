<div [attr.inert]="updateSvc.updating()?'':null">
    <header>
        @if (hasHeader()) {
            <app-header />
        }
    </header>
    <main>
        <router-outlet />
    </main>
    <footer></footer>
</div>

<app-update-prompt />
<app-install-prompt />
<app-ios-install-prompt />

@if (toastSvc.message(); as message) {
    <div class="toast" role="status" aria-live="polite">
        <span>{{message}}</span>
    </div>
}
